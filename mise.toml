# The tools phax is built, tested and released with, pinned for every
# machine and every CI job; mise.lock holds each one's checksum per platform.
# The first node is the one on PATH; Node 22 is the schemas package's floor,
# smoked with `mise exec node@22.23.5 -- …`. pnpm is not here: package.json's
# packageManager pins it.
min_version = "2026.11.1"

[tools]
node = ["26.13.1", "22.23.5"]
deno = "2.8.3"
usage = "3.5.2"
gitleaks = "8.30.1"
osv-scanner = "2.4.0"
