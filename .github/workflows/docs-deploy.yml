name: Docs deploy

# Redeploys docs.phax.run from a released tag, by hand:
#   gh workflow run docs-deploy.yml -f tag=vX.Y.Z
# It builds the site at the tag and runs release.yml's four deploy steps
# verbatim: guard, preview upload, preview check, promote. It publishes
# nothing to npm and creates no GitHub Release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (vX.Y.Z)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Verify the tag is this release
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: ${RELEASE_TAG}"
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v${PKG_VERSION}" ]; then
            echo "Version mismatch: tag=${RELEASE_TAG}, package.json=${PKG_VERSION}"
            exit 1
          fi

      - name: Build the docs site
        run: pnpm site:build

      # Identical to release.yml's deploy steps.
      - name: "Deploy docs: guard"
        run: pnpm exec tsx site/build/deploy-guard.ts

      - name: "Deploy docs: upload"
        run: pnpm exec wrangler versions upload --config site/wrangler.jsonc --preview-alias "${RELEASE_TAG//./-}" --tag "$RELEASE_TAG"
        env:
          # runner.* is only available at step level, not in a job's env.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: "Deploy docs: check preview"
        id: preview
        run: pnpm exec tsx site/build/preview-check.ts --upload-output "$WRANGLER_OUTPUT_FILE_PATH" --tag "$RELEASE_TAG"
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson

      - name: "Deploy docs: promote"
        run: pnpm exec wrangler versions deploy "${{ steps.preview.outputs.version-id }}@100%" --config site/wrangler.jsonc --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
