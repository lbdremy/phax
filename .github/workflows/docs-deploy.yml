name: Docs deploy

# Redeploys docs.phax.run from a released tag, by hand:
#   gh workflow run docs-deploy.yml -f tag=vX.Y.Z
# It builds the site at the tag and runs release.yml's four deploy steps
# verbatim: guard, preview upload, preview check, promote. It publishes
# nothing to npm and creates no GitHub Release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (vX.Y.Z)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          # site/public's video is a Git LFS object; the guard refuses its pointer.
          lfs: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Verify the tag is this release
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: ${RELEASE_TAG}"
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v${PKG_VERSION}" ]; then
            echo "Version mismatch: tag=${RELEASE_TAG}, package.json=${PKG_VERSION}"
            exit 1
          fi
          # Only the cut appends the ledger, so a tag on an opening commit fails here.
          LEDGER_LAST="$(node -p "require('./packages/schemas/releases.json').releases.at(-1)")"
          if [ "$RELEASE_TAG" != "v${LEDGER_LAST}" ]; then
            echo "Ledger mismatch: tag=${RELEASE_TAG}, packages/schemas/releases.json ends at ${LEDGER_LAST}"
            exit 1
          fi

      - name: Build the docs site
        run: pnpm site:build

      # Identical to release.yml's deploy steps.
      - name: "Deploy docs: guard"
        run: pnpm exec tsx site/build/deploy-guard.ts

      - name: "Deploy docs: upload"
        run: pnpm exec wrangler versions upload --config site/wrangler.jsonc --preview-alias "${RELEASE_TAG//./-}" --tag "$RELEASE_TAG"
        env:
          # runner.* is only available at step level, not in a job's env.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: "Deploy docs: check preview"
        id: preview
        run: pnpm exec tsx site/build/preview-check.ts --upload-output "$WRANGLER_OUTPUT_FILE_PATH" --tag "$RELEASE_TAG"
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson

      - name: "Deploy docs: promote"
        run: pnpm exec wrangler versions deploy "${{ steps.preview.outputs.version-id }}@100%" --config site/wrangler.jsonc --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
