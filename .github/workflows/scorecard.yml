# OpenSSF Scorecard: rates the repository's supply-chain practices (pinned
# actions, token permissions, branch rules, SAST, signed releases…) on every
# push to main and weekly, publishes the score the README badge shows, and
# uploads the findings to the Security tab. Publishing makes the API check
# this workflow: no workflow-level env or write permission, and only the
# actions below in its job.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # The Security tab's code scanning results.
      security-events: write
      # The OIDC token that proves the published score comes from this workflow.
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
