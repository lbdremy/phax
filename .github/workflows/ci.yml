name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release rehearsal builds the release notes, which read the
          # commits and tags since the previous release: v<previous>..HEAD.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install

      - name: Install usage CLI
        env:
          USAGE_VERSION: v3.5.2
        run: |
          curl -fsSL "https://github.com/jdx/usage/releases/download/${USAGE_VERSION}/usage-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin usage
          usage --version

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm test:type

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Knip
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Docs site
        run: pnpm site:build

      - name: Architecture audit
        run: pnpm audit:architecture

      - name: Deno smoke
        run: pnpm deno:smoke

      - name: Deno compile (host binary)
        run: pnpm deno:compile

      # The same smoke the release workflow runs before publishing: the
      # tarball the Build step produced, installed into an empty Node 20
      # project. It needs the network, so it stays out of check:full.
      - name: Use Node 20 for the schemas package smoke
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"

      - name: Smoke-test the schemas package tarball
        run: pnpm exec tsx scripts/schemas-smoke.ts

      # Last, since it rewrites the tree: cut the opened version package.json
      # names in place, typecheck it and run the tests that read what a cut
      # changes, so a test that holds only until the next cut fails here
      # rather than at release.
      - name: Use Node 24 for the release rehearsal
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Release rehearsal
        run: scripts/release.sh --rehearse "$(node -p 'require("./package.json").version')"

  # Security audit, blocking on a high finding (the script's default
  # FAIL_ON=high); the report is uploaded as an artifact either way. See
  # docs/security.md "Keeping security high".
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit:security

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-audit-report
          path: dist/security-audit/
          if-no-files-found: warn
