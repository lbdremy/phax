name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release rehearsal builds the release notes, which read the
          # commits and tags since the previous release: v<previous>..HEAD.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true

      # Node, Deno, usage, gitleaks and osv-scanner at the versions mise.toml
      # pins, each checked against its mise.lock checksum (install --locked).
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: "2026.11.1"
          cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm test:type

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Knip
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Docs site
        run: pnpm site:build

      - name: Architecture audit
        run: pnpm audit:architecture

      - name: Deno smoke
        run: pnpm deno:smoke

      - name: Deno compile (host binary)
        run: pnpm deno:compile

      # The same smoke the release workflow runs before publishing: the
      # tarball the Build step produced, installed into an empty Node 22
      # project. It needs the network, so it stays out of check:full. mise
      # puts Node 22 first on PATH for this step only.
      - name: Smoke-test the schemas package tarball
        run: mise exec node@22 -- pnpm exec tsx scripts/schemas-smoke.ts

      # Last, since it rewrites the tree: cut the opened version package.json
      # names in place, typecheck it and run the tests that read what a cut
      # changes, so a test that holds only until the next cut fails here
      # rather than at release.
      - name: Release rehearsal
        run: scripts/release.sh --rehearse "$(node -p 'require("./package.json").version')"
