name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release rehearsal builds the release notes, which read the
          # commits and tags since the previous release: v<previous>..HEAD.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true

      # Node, Deno, usage, gitleaks and osv-scanner at the versions mise.toml
      # pins, each checked against its mise.lock checksum (install --locked).
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5
        with:
          version: "2026.11.1"
          cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm test:type

      - name: Test
        run: pnpm test

      # The property tests' budget (spec property-tests, ac-budget): at the
      # default 100 inputs per property, the property files together take at
      # most 60 seconds on CI. Timed alone, so the time is theirs and not a
      # loaded suite's; the Test step above already ran them.
      - name: Property tests budget
        run: |
          start=$(date +%s)
          pnpm test:unit tests/unit/property
          elapsed=$(( $(date +%s) - start ))
          echo "The property tests took ${elapsed} s of their 60 s budget"
          if [ "$elapsed" -gt 60 ]; then
            echo "::error::The property tests took ${elapsed} s, over their 60 s budget (docs/property-tests.md)"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Knip
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Docs site
        run: pnpm site:build

      - name: Architecture audit
        run: pnpm audit:architecture

      - name: Deno smoke
        run: pnpm deno:smoke

      - name: Deno compile (host binary)
        run: pnpm deno:compile

      # The same smoke the release workflow runs before publishing: the
      # tarball the Build step produced, installed into an empty Node 22
      # project. It needs the network, so it stays out of check:full. mise
      # puts Node 22 first on PATH for this step only.
      - name: Smoke-test the schemas package tarball
        run: mise exec node@22 -- pnpm exec tsx scripts/schemas-smoke.ts

      # Last, since it rewrites the tree: cut the opened version package.json
      # names in place, typecheck it and run the tests that read what a cut
      # changes, so a test that holds only until the next cut fails here
      # rather than at release.
      - name: Release rehearsal
        run: scripts/release.sh --rehearse "$(node -p 'require("./package.json").version')"
