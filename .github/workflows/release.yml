name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; the release job asks for its own writes.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # site/public's video is a Git LFS object; the deploy guard refuses its pointer.
          lfs: true

      # The release commit carries its notes (scripts/release-cut.ts writes
      # them); a tag without them fails here, before anything is built.
      - name: Verify the release notes
        run: |
          NOTES="docs/releases/${RELEASE_TAG#v}.md"
          if [ ! -s "$NOTES" ]; then
            echo "${NOTES} is missing or empty: the release commit must carry the notes that scripts/release-cut.ts writes"
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true

      # Node, Deno, usage, gitleaks and osv-scanner at the versions mise.toml
      # pins, each checked against its mise.lock checksum (install --locked).
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: "2026.11.1"
          cache: false

      - name: Install dependencies
        run: pnpm install

      # The GitHub Release body is the notes' short form; a body over GitHub's
      # limit fails here, before the gate and the binary builds.
      - name: Write the GitHub release body
        id: notes
        run: |
          pnpm exec tsx scripts/release-notes.ts --github-body "docs/releases/${RELEASE_TAG#v}.md" > "$RUNNER_TEMP/release-body.md"
          echo "path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Gate
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm format:check
          pnpm knip
          pnpm build
          pnpm site:build
          pnpm audit:architecture
          pnpm deno:smoke

      - name: Build release binaries
        # TODO: macOS binaries are not code-signed or notarized. Gatekeeper will
        # block them on first run until the user approves in System Settings.
        # Fix: obtain an Apple Developer account, sign with codesign --sign
        # "Developer ID Application: ...", notarize with notarytool, and staple
        # the ticket. Until then, document xattr -dr com.apple.quarantine <binary>
        # as the workaround for direct downloads.
        run: pnpm deno:build-binaries

      # The schemas package promises Node 22: smoke the tarball the Gate's
      # pnpm build produced under Node 22, in this job, so the publish below
      # ships exactly the smoked build. mise puts Node 22 first on PATH for
      # this step only; the steps after it run on Node 26.
      - name: Smoke-test the schemas package tarball
        run: mise exec node@22 -- pnpm exec tsx scripts/schemas-smoke.ts

      - name: Upgrade npm to support stage publish
        run: npm install -g npm@11.16.0

      - name: Prepare npm wrapper
        run: deno run --allow-read --allow-write scripts/prepare-npm.ts "$RELEASE_TAG"

      # Between releases packages/schemas/package.json names the opened
      # version; prepare-npm.ts sets npm/package.json. Both must equal the tag
      # before anything is staged. The cut appends the tag's version to the
      # release ledger, which the opening never does, so the ledger's last
      # entry must equal the tag too: a tag on an opening commit fails here.
      - name: Verify package versions match tag
        run: |
          TAG_VERSION="$RELEASE_TAG"
          TAG_VERSION="${TAG_VERSION#v}"
          STATUS=0
          for MANIFEST in npm/package.json packages/schemas/package.json; do
            PKG_VERSION="$(node -e "console.log(require('./${MANIFEST}').version)")"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Version mismatch: tag=${TAG_VERSION}, ${MANIFEST}=${PKG_VERSION}"
              STATUS=1
            fi
          done
          LEDGER_LAST="$(node -p "require('./packages/schemas/releases.json').releases.at(-1)")"
          if [ "$TAG_VERSION" != "$LEDGER_LAST" ]; then
            echo "Ledger mismatch: tag=${TAG_VERSION}, packages/schemas/releases.json ends at ${LEDGER_LAST}"
            STATUS=1
          fi
          exit "$STATUS"

      # docs.phax.run deploys after every fallible check and before anything
      # is staged on npm. The guard refuses a build that drops a schema URL
      # the live site serves; the upload lands on a preview alias (v0-18-0)
      # without serving it; promotion follows only a passing preview check.
      # A failure leaves the promoted site serving and stages nothing.
      # docs-deploy.yml repeats these four steps verbatim.
      - name: "Deploy docs: guard"
        run: pnpm exec tsx site/build/deploy-guard.ts

      - name: "Deploy docs: upload"
        run: pnpm exec wrangler versions upload --config site/wrangler.jsonc --preview-alias "${RELEASE_TAG//./-}" --tag "$RELEASE_TAG"
        env:
          # runner.* is only available at step level, not in a job's env.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: "Deploy docs: check preview"
        id: preview
        run: pnpm exec tsx site/build/preview-check.ts --upload-output "$WRANGLER_OUTPUT_FILE_PATH" --tag "$RELEASE_TAG"
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson

      - name: "Deploy docs: promote"
        run: pnpm exec wrangler versions deploy "${VERSION_ID}@100%" --config site/wrangler.jsonc --yes
        env:
          VERSION_ID: ${{ steps.preview.outputs.version-id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The schemas package stages first: if it fails, nothing of the
      # release is staged; if the wrapper then fails, a staged schemas
      # package without its phax harms nobody.
      - name: npm stage publish @lbdremy/phax-schemas
        working-directory: packages/schemas
        run: npm stage publish --access public --provenance

      - name: npm stage publish @lbdremy/phax
        working-directory: npm
        run: npm stage publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          # The body is the short form of docs/releases/<X.Y.Z>.md; the docs
          # site page has the full notes, with each surface's examples.
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/release/phax-darwin-arm64
            dist/release/phax-darwin-arm64.sha256
            dist/release/phax-darwin-x64
            dist/release/phax-darwin-x64.sha256
            dist/release/phax-linux-x64
            dist/release/phax-linux-x64.sha256
            dist/release/phax-linux-arm64
            dist/release/phax-linux-arm64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
