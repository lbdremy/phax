# Weekly version updates for the pnpm tree and the workflows' actions. Minor
# and patch updates come grouped, one pull request per ecosystem; a major
# comes alone, since it is the one that needs reading. Security updates are
# separate: they follow the repository's Dependabot alerts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
